<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Slideshow</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .slideshow-container { max-width: 90%; max-height: 90vh; position: relative; }
        .slide { display: none; width: 100%; height: auto; max-height: 90vh; object-fit: contain; }
        .active { display: block; }
    </style>
</head>
<body>

<div class="slideshow-container" id="slideshow">
    <!-- Images will load here automatically -->
</div>

<script>
    // CONFIGURATION: Change these to match your account
    const username = "sirhcb";
    const repo = "NotreArms";
    const folderPath = "CoAs"; 

    const apiUrl = `https://github.com{username}/${repo}/contents/${folderPath}`;
    let currentIndex = 0;
    let images = [];

    async function fetchImages() {
        try {
            const response = await fetch(apiUrl);
            const data = await response.json();
            
            // Filter out non-image files
            images = data.filter(file => file.type === "file" && /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name));
            
            if (images.length === 0) return;
            
            renderSlideshow();
            startSlideshow();
        } catch (error) {
            console.error("Error fetching images:", error);
        }
    }

    function renderSlideshow() {
        const container = document.getElementById('slideshow');
        images.forEach((img, index) => {
            const imageElement = document.createElement('img');
            imageElement.src = img.download_url;
            imageElement.classList.add('slide');
            if (index === 0) imageElement.classList.add('active');
            container.appendChild(imageElement);
        });
    }

    function startSlideshow() {
        const slides = document.querySelectorAll('.slide');
        setInterval(() => {
            slides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add('active');
        }, 3000); // Changes image every 3 seconds
    }

    fetchImages();
</script>
</body>
</html>
