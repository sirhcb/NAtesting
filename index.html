<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Albums</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 40px; color: #333; }
        .menu-container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        ul { list-style-type: none; padding: 0; }
        li { margin: 15px 0; }
        a { display: block; padding: 15px; background: #eee; color: #333; text-decoration: none; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        a:hover { background: #0066cc; color: white; }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>⛪ Notre Arms ⛪</h1>
        <p>Select an album below to view the slideshow:</p>
        <hr>

        <ul>
            {% for gallery in site.slideshows %}
            <li>
                <a href="{{ gallery.url | relative_url }}">{{ gallery.title }}</a>
            </li>
            {% endfor %}
        </ul>
    </div>
<p>
    <a href="/NAtesting/slideshows/Series I/#slide-3" style="display:inline; padding:0; background:none; color:#0066cc; font-weight:normal;">Boermac</a>!
</p>
</body>
</html>
